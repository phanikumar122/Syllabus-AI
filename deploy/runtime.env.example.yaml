# Non-secret settings only. Copy to runtime.env.yaml and edit locally.
# Keep this origin aligned with Firebase Auth domains and Stripe webhooks.
NODE_ENV: "production"
FIREBASE_PROJECT_ID: "syllabus-ai-c35aa"
VITE_FIREBASE_DATABASE_ID: ""
APP_URL: "https://syllabus-ai-c35aa.web.app"
ALLOW_LOCAL_AI: "false"
GEMINI_MODEL: "gemini-2.5-flash"
STRIPE_PRICE_ID: "REPLACE_WITH_RECURRING_PRICE_ID"
BILLING_REQUIRED: "false"
SMTP_HOST: "REPLACE_WITH_SMTP_HOST"
SMTP_PORT: "587"
SMTP_USER: "REPLACE_WITH_SMTP_USERNAME"
SMTP_FROM: "Syllabus AI <study@example.com>"
VAPID_PUBLIC_KEY: "REPLACE_WITH_PUBLIC_VAPID_KEY"
VAPID_SUBJECT: "mailto:support@example.com"
# Cloud Scheduler runs the separate job; no interval worker inside API instances.
NOTIFICATION_WORKER_ENABLED: "false"
