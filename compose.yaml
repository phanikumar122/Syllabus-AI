services:
  api:
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "8080"
      NOTIFICATION_WORKER_ENABLED: "false"
    ports:
      - "127.0.0.1:3001:8080"
    init: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
